<ion-card class="wiki-card">
  <img
    [src]="image"
    class="card-image"
    (error)="image = 'assets/icons/image.png'"
  />

  <ion-card-content>
    <h2 class="card-title">
      {{ title }}
    </h2>

    <p class="card-subtitle" *ngIf="subtitle">
      {{ subtitle }}
    </p>

    <p class="card-extra" *ngIf="extra">
      {{ extra }}
    </p>
  </ion-card-content>
</ion-card>
