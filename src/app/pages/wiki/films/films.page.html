<ion-content class="wiki-content">
  <div class="page-wrapper">
    <h1 class="title">{{ section?.title }}</h1>

    <div *ngIf="loading">
      Cargando...
    </div>

    <div class="film-list">
      <app-wiki-card
        *ngFor="let film of films"
        [title]="film.title"
        [subtitle]="'Episodio ' + film.episode_id"
        [extra]="'Director: ' + film.director"
        [image]="getImage(film)"
        (click)="openFilm(film)"
      >
      </app-wiki-card>
    </div>

    <ion-button
      expand="block"
      fill="outline"
      class="back-btn"
      routerLink="/wiki"
    >
      Volver
    </ion-button>
  </div>
</ion-content>
