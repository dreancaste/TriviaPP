<ion-content class="wiki-content">
  <div class="page-wrapper">
    <h1 class="title">{{ section?.title }}</h1>

    <div *ngIf="loading">
      Cargando...
    </div>

    <div *ngIf="!loading && error">
      {{ error }}
      <ion-button expand="block" fill="outline" (click)="loadPlanets()">
        Reintentar
      </ion-button>
    </div>

    <div class="planet-list" *ngIf="!error">
      <app-wiki-card
        *ngFor="let planet of planets"
        [title]="planet.name"
        [subtitle]="'Clima: ' + planet.climateEs"
        [extra]="'Terreno: ' + planet.terrainEs"
        [image]="getImage(getId(planet.url))"
        (click)="openPlanet(planet)"
      >
      </app-wiki-card>
    </div>

    <ion-button
      expand="block"
      fill="outline"
      class="back-btn"
      routerLink="/wiki"
    >
      Volver
    </ion-button>
  </div>
</ion-content>
