<ion-content class="wiki-content">

  <div class="page-wrapper">

    <h1 class="title">Planetas</h1>

    <div *ngIf="loading">
      Cargando...
    </div>

    <div class="planet-list">

      <app-wiki-card

        *ngFor="let planet of planets"

        [title]="planet.name"

        [subtitle]="'Clima: ' + planet.climate"

        [extra]="'Terreno: ' + planet.terrain"

        [image]="getImage(getId(planet.url))"

        (click)="openPlanet(planet)"

      >
      </app-wiki-card>

    </div>

    <ion-button
        expand="block"
        fill="outline"
        class="back-btn"
        routerLink="/wiki"
      >
        Volver
      </ion-button>

  </div>

</ion-content>
