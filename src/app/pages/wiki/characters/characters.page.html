<ion-content class="wiki-content">
  <div class="page-wrapper">
    <h1 class="title">{{ section?.title }}</h1>

    <div *ngIf="loading">
      Cargando...
    </div>

    <div *ngIf="!loading && error">
      {{ error }}
      <ion-button expand="block" fill="outline" (click)="loadCharacters()">
        Reintentar
      </ion-button>
    </div>

    <div class="character-list" *ngIf="!error">
      <app-wiki-card
        *ngFor="let character of characters"
        [title]="character.name"
        [image]="getImage(getId(character.url))"
        (click)="openCharacter(character)"
      >
      </app-wiki-card>
    </div>

    <ion-button
      expand="block"
      fill="outline"
      class="back-btn"
      routerLink="/wiki"
    >
      Volver
    </ion-button>
  </div>
</ion-content>
