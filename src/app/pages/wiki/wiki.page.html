<ion-content class="wiki-content">
  <div class="overlay">
    <div class="wiki-card">
      <div class="wiki-header">
        <h2>Wiki Star Wars</h2>
        <p>Explora personajes, películas y planetas del universo galáctico</p>
      </div>

      <div class="contenedor-principal">
        <div class="wiki-card" (click)="goToCharacters()">Personajes</div>

        <div class="wiki-card" (click)="goToFilms()">Películas</div>

        <div class="wiki-card" (click)="goToPlanets()">Planetas</div>
      </div>

      <ion-button
        expand="block"
        fill="outline"
        class="back-btn"
        routerLink="/home"
      >
        Volver
      </ion-button>
    </div>
  </div>
</ion-content>
